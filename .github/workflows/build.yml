name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/SlizsyChecker -c Release -r win-x64 -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: SlizsyChecker-win-x64
          path: dist/SlizsyChecker.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SlizsyChecker.exe
          generate_release_notes: true
